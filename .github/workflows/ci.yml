name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: video_auditor_test
          POSTGRES_USER: video_auditor
          POSTGRES_PASSWORD: video_auditor_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_auditor -d video_auditor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+psycopg://video_auditor:video_auditor_test_password@localhost:5432/video_auditor_test
      GEMINI_API_KEY: ci-placeholder-key
      FFPROBE_REQUIRED: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate browser JavaScript syntax
        run: python scripts/check_frontend.py
