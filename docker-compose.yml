services:
  postgres:
    image: postgres:17-alpine
    container_name: video_auditor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_auditor
      POSTGRES_USER: video_auditor
      POSTGRES_PASSWORD: video_auditor_dev_password
    ports:
      - "5433:5432"
    volumes:
      - video_auditor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_auditor -d video_auditor"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://video_auditor:video_auditor_dev_password@postgres:5432/video_auditor
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://video_auditor:video_auditor_dev_password@postgres:5432/video_auditor
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://video_auditor:video_auditor_dev_password@postgres:5432/video_auditor
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  video_auditor_pgdata:
